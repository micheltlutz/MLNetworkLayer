# Build e testes (Swift Package Manager + Swift Testing).
# Requer macOS: o alvo declara iOS/macOS/tvOS/watchOS/visionOS.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Package.swift: swift-tools-version 6.0 — requer Xcode 16+ (Swift 6).
      - name: Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Versões da toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolver dependências
        run: swift package resolve

      - name: Build
        run: swift build --build-tests -v

      - name: Testes unitários
        run: swift test -v
